name: Playground Selenium Tests

on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: "Target network"
        required: true
        default: "dev"
        options:
          - "dev"
          - "qa"
          - "test"
          - "main"
      branch:
        type: choice
        description: "Git branch to test"
        required: true
        default: "development"
        options:
          - "development"
          - "main"
      local:
        type: boolean
        description: "Build Local Environment"
        default: false

  schedule:
    - cron: "0 6 * * *"

jobs:
  run-selenium-tests:
    name: Run Selenium Tests (${{ matrix.env }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        env: [dev, qa, test, main]

    env:
      ENV: ${{ matrix.env }}
      BRANCH: ${{ github.event.inputs.branch || 'development' }}
      LOCAL: ${{ github.event.inputs.local || 'false' }}

    steps:
      - name: Skip if manual env input doesn't match matrix
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.env != matrix.env
        run: echo "Skipping job because env mismatch" && exit 0

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y xclip

      - name: Install Python Dependencies
        run: pip install -r packages/playground/tests/frontend_selenium/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.15"

      - name: Install Node Dependencies
        run: yarn install

      - name: Configure Environment File
        run: |
          if [ "$LOCAL" == "true" ]; then
            sed -i "s/^net = .*/net = local/" packages/playground/tests/frontend_selenium/Config.ini
          else
            sed -i "s/^net = .*/net = $ENV/" packages/playground/tests/frontend_selenium/Config.ini
          fi

      - name: Lerna Build (Local Only)
        if: env.LOCAL == 'true'
        run: yarn lerna run build

      - name: Generate Local Config (Local Only)
        if: env.LOCAL == 'true'
        working-directory: packages/playground/public
        run: MODE=$ENV bash ../scripts/build-env.sh

      - name: Start Playground Server (Local Only)
        if: env.LOCAL == 'true'
        run: make run project=playground &

      - name: Wait for Local Server
        if: env.LOCAL == 'true'
        run: sleep 60

      - name: Run Selenium Tests
        working-directory: ./packages/playground/tests/frontend_selenium
        env:
          TFCHAIN_MNEMONICS: ${{ secrets.TFCHAIN_MNEMONICS }}
          TFCHAIN_NODE_MNEMONICS: ${{ secrets.TFCHAIN_NODE_MNEMONICS }}
          STELLAR_ADDRESS: ${{ secrets.STELLAR_ADDRESS }}
          EMAIL: ${{ secrets.EMAIL }}
        run: python -m pytest -v

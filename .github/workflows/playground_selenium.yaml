name: Playground Selenium Tests

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Select the target environment"
        required: true
        type: choice
        default: "dev"
        options:
          - dev
          - qa
          - test
          - main
      local_build:
        description: "Build & serve dashboard locally?"
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "0 6 * * *"

jobs:
  selenium-run:
    runs-on: ubuntu-latest

    env:
      NETWORK: ${{ github.event.inputs.network || 'dev' }}
      LOCAL_BUILD: ${{ github.event.inputs.local_build || 'false' }}
      TFCHAIN_MNEMONICS: ${{ secrets.TFCHAIN_MNEMONICS }}
      TFCHAIN_NODE_MNEMONICS: ${{ secrets.TFCHAIN_NODE_MNEMONICS }}
      STELLAR_ADDRESS: ${{ secrets.STELLAR_ADDRESS }}
      EMAIL: ${{ secrets.EMAIL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python packages
        run: |
          pip install -r packages/playground/tests/frontend_selenium/requirements.txt
          pip install pytest-html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Yarn install (only for local build)
        if: ${{ env.LOCAL_BUILD == 'true' }}
        run: yarn install

      - name: Lerna build (only for local build)
        if: ${{ env.LOCAL_BUILD == 'true' }}
        run: yarn lerna run build

      - name: Serve Dashboard (only for local build)
        if: ${{ env.LOCAL_BUILD == 'true' }}
        run: make run project=playground &

      - name: Wait for local server to boot (only for local build)
        if: ${{ env.LOCAL_BUILD == 'true' }}
        run: sleep 60

      - name: Validate secrets are present
        run: |
          if [ -z "${TFCHAIN_MNEMONICS}" ] || [ -z "${TFCHAIN_NODE_MNEMONICS}" ] || [ -z "${STELLAR_ADDRESS}" ] || [ -z "${EMAIL}" ]; then
            echo "❌ One or more secrets are missing!"
            exit 1
          fi

      - name: Create Config.ini dynamically
        run: |
          echo "[Base]" > Config.ini
          echo "port=5173" >> Config.ini
          echo "net=${{ env.LOCAL_BUILD == 'true' && 'local' || env.NETWORK }}" >> Config.ini
          echo "[Utils]" >> Config.ini
          echo "seed=$(echo "$TFCHAIN_MNEMONICS" | tr -d '\n' | sed 's/"/\\"/g')" >> Config.ini
          echo "node_seed=$(echo "$TFCHAIN_NODE_MNEMONICS" | tr -d '\n' | sed 's/"/\\"/g')" >> Config.ini
          echo "address=$(echo "$STELLAR_ADDRESS" | tr -d '\n')" >> Config.ini
          echo "email=$(echo "$EMAIL" | tr -d '\n')" >> Config.ini
        working-directory: ./packages/playground/tests/frontend_selenium

      - name: Print Config.ini (for debugging)
        run: nl Config.ini
        working-directory: ./packages/playground/tests/frontend_selenium

      - name: Run Selenium tests with HTML report
        working-directory: ./packages/playground/tests/frontend_selenium
        run: python -m pytest -v --html=report.html

      - name: Upload HTML report
        uses: actions/upload-artifact@v3
        with:
          name: selenium-report
          path: packages/playground/tests/frontend_selenium/report.html

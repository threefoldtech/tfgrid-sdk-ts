name: Playground Selenium Tests

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Select the network to run tests on (dev, qa, test, main)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - test
          - main
  schedule:
    - cron: "0 6 * * *"

jobs:
  selenium-run:
    runs-on: ubuntu-latest

    # expose the chosen network alongside your secrets
    env:
      NETWORK: ${{ inputs.network }}
      TFCHAIN_MNEMONICS: ${{ secrets.TFCHAIN_MNEMONICS }}
      TFCHAIN_NODE_MNEMONICS: ${{ secrets.TFCHAIN_NODE_MNEMONICS }}
      STELLAR_ADDRESS: ${{ secrets.STELLAR_ADDRESS }}
      EMAIL: ${{ secrets.EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setting up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installing all necessary Python packages
        run: pip install -r packages/playground/tests/frontend_selenium/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Yarn install
        run: yarn install

      - name: Lerna Build
        run: yarn lerna run build

      - name: Serve Dashboard locally
        run: make run project=playground &

      - name: Wait for local server
        run: sleep 60

      - name: Debug env
        run: |
          echo "NETWORK=$NETWORK"
          echo "TFCHAIN_MNEMONICS is set? ${TFCHAIN_MNEMONICS:+yes}"
          echo "TFCHAIN_NODE_MNEMONICS is set? ${TFCHAIN_NODE_MNEMONICS:+yes}"
          echo "STELLAR_ADDRESS is set? ${STELLAR_ADDRESS:+yes}"
          echo "EMAIL is set? ${EMAIL:+yes}"

      - name: Run tests
        working-directory: ./packages/playground/tests/frontend_selenium
        run: python -m pytest -v

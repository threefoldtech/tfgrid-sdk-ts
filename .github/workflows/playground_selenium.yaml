name: Playground Selenium Tests

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Select the target environment"
        required: true
        type: choice
        default: "dev"
        options:
          - dev
          - qa
          - test
          - main
      local_build:
        description: "Build & serve dashboard locally?"
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "0 6 * * *"

jobs:
  selenium-run:
    runs-on: ubuntu-latest

    env:
      # Fallback for scheduled runs
      NETWORK: ${{ github.event.inputs.network || 'dev' }}
      LOCAL_BUILD: ${{ github.event.inputs.local_build || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python packages
        run: |
          pip install -r packages/playground/tests/frontend_selenium/requirements.txt
          pip install pytest-html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Yarn install
        if: ${{ env.LOCAL_BUILD == 'true' }}
        run: yarn install

      - name: Lerna Build
        if: ${{ env.LOCAL_BUILD == 'true' }}
        run: yarn lerna run build

      - name: Yarn Serve
        if: ${{ env.LOCAL_BUILD == 'true' }}
        run: make run project=playground &

      - name: Wait for local server
        if: ${{ env.LOCAL_BUILD == 'true' }}
        run: sleep 60

      - name: Run Selenium tests
        working-directory: ./packages/playground/tests/frontend_selenium
        env:
          TFCHAIN_MNEMONICS: ${{ secrets.TFCHAIN_MNEMONICS }}
          TFCHAIN_NODE_MNEMONICS: ${{ secrets.TFCHAIN_NODE_MNEMONICS }}
          STELLAR_ADDRESS: ${{ secrets.STELLAR_ADDRESS }}
          EMAIL: ${{ secrets.EMAIL }}
          NETWORK: ${{ env.NETWORK }}
          DASHBOARD_URL: ${{ env.LOCAL_BUILD == 'true' && 'http://localhost:8080' || format('https://dashboard.%s.grid.tf', env.NETWORK) }}
        run: |
          echo "Running against: $DASHBOARD_URL"
          python -m pytest -v --html=report.html --base-url="$DASHBOARD_URL"

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report-${{ env.NETWORK }}
          path: packages/playground/tests/frontend_selenium/report.html

name: Playground Selenium Tests

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Select network (dev, qa, test, main)"
        required: true
        default: dev
        type: choice
        options: [dev, qa, test, main]
      mode:
        description: "Select mode (build|remote)"
        required: true
        default: remote
        type: choice
        options: [build, remote]
  schedule:
    - cron: "0 6 * * *"

jobs:
  selenium-run:
    runs-on: ubuntu-latest
    env:
      TFCHAIN_MNEMONICS: ${{ secrets.TFCHAIN_MNEMONICS }}
      TFCHAIN_NODE_MNEMONICS: ${{ secrets.TFCHAIN_NODE_MNEMONICS }}
      STELLAR_ADDRESS: ${{ secrets.STELLAR_ADDRESS }}
      EMAIL: ${{ secrets.EMAIL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine network + mode
        id: vars
        run: |
          echo "network=${{ github.event.inputs.network }}" >> $GITHUB_OUTPUT
          echo "mode=${{ github.event.inputs.mode }}"       >> $GITHUB_OUTPUT

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Installing all necessary packages
        run: pip install -r  packages/playground/tests/frontend_selenium/requirements.txt
      - name: Node install
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Node deps
        run: yarn install

      - name: Build & serve (local build only)
        if: ${{ steps.vars.outputs.mode == 'build' }}
        run: |
          yarn lerna run build
          nohup make run project=playground > server.log 2>&1 &
          echo "Waiting for http://localhost:5173…"
          for i in {1..60}; do
            curl -sf http://localhost:5173 && break
            sleep 1
          done

      - name: Generate Config.ini via Python
        working-directory: packages/playground/tests/frontend_selenium
        env:
          NETWORK: ${{ steps.vars.outputs.network }}
          MODE: ${{ steps.vars.outputs.mode }}
        run: |
          python3 - <<'EOF'
          import os, configparser

          cfg = configparser.ConfigParser()
          # Prevent line wrapping in config values
          cfg._interpolation = configparser.ExtendedInterpolation()
            
          base_url = (
              "http://localhost:5173" 
              if os.environ["MODE"] == "build" 
              else f"https://dashboard.{os.environ['NETWORK']}.grid.tf/"
          )

          cfg["Base"] = {
              "port": "5173",
              "net": os.environ["NETWORK"],
              "base_url": base_url
          }

          # Format secrets as single-line values
          cfg["Utils"] = {
              "seed": os.environ["TFCHAIN_MNEMONICS"].replace('\n', ' '),
              "node_seed": os.environ["TFCHAIN_NODE_MNEMONICS"].replace('\n', ' '),
              "address": os.environ["STELLAR_ADDRESS"],
              "email": os.environ["EMAIL"]
          }

          with open("Config.ini", "w") as f:
              cfg.write(f)
          EOF

      - name: Verify Config.ini
        working-directory: packages/playground/tests/frontend_selenium
        run: |
          echo "\n→ Config.ini contents:\n"
          nl Config.ini

      - name: Run Selenium tests
        working-directory: packages/playground/tests/frontend_selenium
        run: python -m pytest -v --html=report.html

name: "Playground Selenium Tests (Phase 1: Remote)"

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Select the network to run tests on (dev, qa, test, main)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - test
          - main
  schedule:
    - cron: "0 6 * * *"

jobs:
  remote-tests:
    runs-on: ubuntu-latest

    env:
      TFCHAIN_MNEMONICS: ${{ secrets.TFCHAIN_MNEMONICS }}
      TFCHAIN_NODE_MNEMONICS: ${{ secrets.TFCHAIN_NODE_MNEMONICS }}
      STELLAR_ADDRESS: ${{ secrets.STELLAR_ADDRESS }}
      EMAIL: ${{ secrets.EMAIL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          pip install -r packages/playground/tests/frontend_selenium/requirements.txt
          pip install pytest-html

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Node.js dependencies
        run: yarn install

      - name: Patch base.py for DevNet URL
        if: ${{ inputs.network == 'dev' }}
        run: |
          sed -i 's|staging.dashboard.dev.grid.tf|dashboard.dev.grid.tf|g' \
            packages/playground/tests/frontend_selenium/utils/base.py

      - name: Write clean Config.ini
        run: |
          cd packages/playground/tests/frontend_selenium
          rm -f Config.ini

          # strip newline characters out of secrets
          CLEAN_SEED=$(printf "%s" "$TFCHAIN_MNEMONICS" | tr -d '\r\n')
          CLEAN_NODE=$(printf "%s" "$TFCHAIN_NODE_MNEMONICS" | tr -d '\r\n')
          CLEAN_ADDRESS=$(printf "%s" "$STELLAR_ADDRESS" | tr -d '\r\n')
          CLEAN_EMAIL=$(printf "%s" "$EMAIL" | tr -d '\r\n')

          # Base section
          echo "[Base]"               >  Config.ini
          echo "port = 5173"          >> Config.ini
          echo "net = ${{ inputs.network }}" >> Config.ini

          # Utils section
          echo "[Utils]"              >> Config.ini
          echo "seed = $CLEAN_SEED"   >> Config.ini
          echo "node_seed = $CLEAN_NODE" >> Config.ini
          echo "address = $CLEAN_ADDRESS" >> Config.ini
          echo "email = $CLEAN_EMAIL" >> Config.ini

      - name: Debug Config.ini
        run: nl packages/playground/tests/frontend_selenium/Config.ini

      - name: Run Selenium tests
        working-directory: packages/playground/tests/frontend_selenium
        run: python -m pytest -v --html=report.html

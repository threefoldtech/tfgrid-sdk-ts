name: Playground Selenium Tests

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Select the network to run tests on (dev, qa, test, main)"
        required: true
        default: "dev" # Default to 'dev' if no network is selected
        type: choice
        options:
          - dev
          - qa
          - test
          - main
      mode:
        description: "Select the mode to run tests (build locally or use existing URL)"
        required: true
        default: "build" # Default to 'build' if no mode is selected
        type: choice
        options:
          - build
          - remote

jobs:
  selenium-run:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Setting up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Step 3: Install Python dependencies
      - name: Install Python Dependencies
        run: pip install -r packages/playground/tests/frontend_selenium/requirements.txt

      # Step 4: Set up Node.js
      - name: Node Install
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Step 5: Install Node.js dependencies
      - name: Install Node Dependencies
        run: yarn install

      # Step 6: Build the project
      - name: Build Project
        run: yarn lerna run build

      # Step 7: Start the local environment (only for "build" mode)
      - name: Start Local Environment
        if: ${{ inputs.mode == 'build' }}
        run: make run project=playground &

      # Step 8: Wait for the local environment to start
      - name: Wait for Local Environment
        if: ${{ inputs.mode == 'build' }}
        run: sleep 60

      # Step 9: Configure Environment
      - name: Configure Environment
        run: |
          echo "[Base]" > packages/playground/tests/frontend_selenium/Config.ini
          echo "port = 5173" >> packages/playground/tests/frontend_selenium/Config.ini
          echo "net = ${{ inputs.network }}" >> packages/playground/tests/frontend_selenium/Config.ini
          if [ "${{ inputs.mode }}" == "build" ]; then
            echo "base_url = http://localhost:5173" >> packages/playground/tests/frontend_selenium/Config.ini
          else
            case ${{ inputs.network }} in
              dev) echo "base_url = https://staging.dashboard.dev.grid.tf/" >> packages/playground/tests/frontend_selenium/Config.ini ;;
              qa) echo "base_url = https://dashboard.qa.grid.tf/" >> packages/playground/tests/frontend_selenium/Config.ini ;;
              test) echo "base_url = https://dashboard.test.grid.tf/" >> packages/playground/tests/frontend_selenium/Config.ini ;;
              main) echo "base_url = https://dashboard.grid.tf/" >> packages/playground/tests/frontend_selenium/Config.ini ;;
            esac
          fi

      # Step 10: Debug Config File
      - name: Debug Config File
        run: cat packages/playground/tests/frontend_selenium/Config.ini

      # Step 11: Run Tests
      - name: Run Selenium Tests
        working-directory: ./packages/playground/tests/frontend_selenium
        env:
          TFCHAIN_MNEMONICS: ${{ secrets.TFCHAIN_MNEMONICS }}
          TFCHAIN_NODE_MNEMONICS: ${{ secrets.TFCHAIN_NODE_MNEMONICS }}
          STELLAR_ADDRESS: ${{ secrets.STELLAR_ADDRESS }}
          EMAIL: ${{ secrets.EMAIL }}
        run: python -m pytest -v

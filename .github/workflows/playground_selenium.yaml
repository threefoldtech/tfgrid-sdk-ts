name: Playground Selenium Tests

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Select the target environment"
        required: true
        type: choice
        default: "dev"
        options:
          - dev
          - qa
          - test
          - main
      local_build:
        description: "Build & serve dashboard locally?"
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "0 6 * * *"

jobs:
  selenium-run:
    runs-on: ubuntu-latest

    env:
      NETWORK: ${{ github.event.inputs.network || 'dev' }}
      LOCAL_BUILD: ${{ github.event.inputs.local_build || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python packages
        run: |
          pip install -r packages/playground/tests/frontend_selenium/requirements.txt
          pip install pytest-html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Yarn install
        if: ${{ env.LOCAL_BUILD == 'true' }}
        run: yarn install

      - name: Lerna Build
        if: ${{ env.LOCAL_BUILD == 'true' }}
        run: yarn lerna run build

      - name: Serve Dashboard
        if: ${{ env.LOCAL_BUILD == 'true' }}
        run: make run project=playground &

      - name: Wait for local server
        if: ${{ env.LOCAL_BUILD == 'true' }}
        run: sleep 60

      - name: Set Config.ini values dynamically
        run: |
          echo "[Base]" > Config.ini
          echo "port=5173" >> Config.ini
          echo "net=${{ env.LOCAL_BUILD == 'true' && 'local' || env.NETWORK }}" >> Config.ini
          echo "[Utils]" >> Config.ini
          echo "seed=${{ secrets.TFCHAIN_MNEMONICS }}" >> Config.ini
          echo "node_seed=${{ secrets.TFCHAIN_NODE_MNEMONICS }}" >> Config.ini
          echo "address=${{ secrets.STELLAR_ADDRESS }}" >> Config.ini
          echo "email=${{ secrets.EMAIL }}" >> Config.ini
        working-directory: ./packages/playground/tests/frontend_selenium

      - name: Run Selenium tests
        working-directory: ./packages/playground/tests/frontend_selenium
        run: python -m pytest -v

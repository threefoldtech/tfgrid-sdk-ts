name: Playground Selenium Tests

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Select the network to run tests on (dev, qa, test, main)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - test
          - main
      mode:
        description: "Select mode: build locally or use existing URL"
        required: true
        default: "remote"
        type: choice
        options:
          - build
          - remote

  schedule:
    - cron: "0 6 * * *"

jobs:
  selenium-run:
    runs-on: ubuntu-latest
    env:
      TFCHAIN_MNEMONICS: ${{ secrets.TFCHAIN_MNEMONICS }}
      TFCHAIN_NODE_MNEMONICS: ${{ secrets.TFCHAIN_NODE_MNEMONICS }}
      STELLAR_ADDRESS: ${{ secrets.STELLAR_ADDRESS }}
      EMAIL: ${{ secrets.EMAIL }}
    defaults:
      run:
        working-directory: packages/playground/tests/frontend_selenium

    steps:
      - name: Determine network + mode
        id: vars
        run: |
          echo "network=${{ github.event.inputs.network }}" >> $GITHUB_OUTPUT
          echo "mode=${{ github.event.inputs.mode }}"       >> $GITHUB_OUTPUT

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install pytest-html

      - name: Generate Config.ini via Python
        run: |
          python3 - <<'EOF'
          import os, configparser

          cfg = configparser.ConfigParser()
          base_url = (
              "http://localhost:5173" if os.environ["mode"] == "build"
              else f"https://dashboard.{os.environ['network']}.grid.tf/"
          )
          cfg["Base"] = {
              "port":     "5173",
              "net":      os.environ["network"],
              "base_url": base_url
          }
          cfg["Utils"] = {
              "seed":      os.environ["TFCHAIN_MNEMONICS"],
              "node_seed": os.environ["TFCHAIN_NODE_MNEMONICS"],
              "address":   os.environ["STELLAR_ADDRESS"],
              "email":     os.environ["EMAIL"]
          }
          with open("Config.ini", "w") as f:
              cfg.write(f)
          EOF

      - name: Debug Config.ini
        run: nl Config.ini

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Node deps
        run: yarn install

      - name: Build & serve (only build-mode)
        if: ${{ steps.vars.outputs.mode == 'build' }}
        run: |
          yarn lerna run build
          nohup make run project=playground > server.log 2>&1 &
          for i in {1..60}; do
            curl -sf http://localhost:5173 && exit
            sleep 1
          done
          echo "Server failed to start" && exit 1

      - name: Run Selenium tests
        run: pytest -v --html=report.html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: report.html

      - name: Upload server logs if build failed
        if: ${{ failure() && steps.vars.outputs.mode == 'build' }}
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: server.log

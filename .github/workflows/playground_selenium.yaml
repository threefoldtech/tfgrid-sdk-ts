name: Playground Selenium Tests

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Select the network to run tests on (dev, qa, test, main)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - test
          - main
      mode:
        description: "Select mode: build locally or use existing URL"
        required: true
        default: "remote"
        type: choice
        options:
          - build
          - remote

  schedule:
    - cron: "0 6 * * *"

jobs:
  selenium-run:
    runs-on: ubuntu-latest

    steps:
      - name: Determine network and mode
        id: vars
        run: |
          network="${{ github.event.inputs.network || 'dev' }}"
          mode="${{ github.event.inputs.mode || 'remote' }}"
          echo "network=$network" >> $GITHUB_OUTPUT
          echo "mode=$mode" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install -r packages/playground/tests/frontend_selenium/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Node dependencies
        run: yarn install

      - name: Build project (only local build)
        if: ${{ steps.vars.outputs.mode == 'build' }}
        run: yarn lerna run build

      - name: Serve dashboard locally (only local build)
        if: ${{ steps.vars.outputs.mode == 'build' }}
        run: |
          nohup make run project=playground > server.log 2>&1 &
          echo "Waiting for server to start..."
          for i in {1..60}; do
            if curl -s http://localhost:5173 >/dev/null; then
              echo "Server is up!"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 60 seconds."
          exit 1

      - name: Generate Config.ini
        working-directory: ./packages/playground/tests/frontend_selenium
        run: |
          rm -f Config.ini
          cat <<EOF > Config.ini
          [Base]
          port = 5173
          net = ${{ steps.vars.outputs.network }}
          base_url = $(
            if [ "${{ steps.vars.outputs.mode }}" = "build" ]; then
              echo "http://localhost:5173"
            else
              case "${{ steps.vars.outputs.network }}" in
                dev)  echo "https://staging.dashboard.dev.grid.tf/" ;;
                qa)   echo "https://dashboard.qa.grid.tf/" ;;
                test) echo "https://dashboard.test.grid.tf/" ;;
                main) echo "https://dashboard.grid.tf/" ;;
              esac
            fi
          )
          [Utils]
          seed = "${TFCHAIN_MNEMONICS}"
          node_seed = "${TFCHAIN_NODE_MNEMONICS}"
          address = "${STELLAR_ADDRESS}"
          email = "${EMAIL}"
          EOF

      - name: Debug Config.ini
        working-directory: ./packages/playground/tests/frontend_selenium
        run: nl Config.ini

      - name: Run Selenium tests
        env:
          NETWORK: ${{ steps.vars.outputs.network }}
          TFCHAIN_MNEMONICS: ${{ secrets.TFCHAIN_MNEMONICS }}
          TFCHAIN_NODE_MNEMONICS: ${{ secrets.TFCHAIN_NODE_MNEMONICS }}
          STELLAR_ADDRESS: ${{ secrets.STELLAR_ADDRESS }}
          EMAIL: ${{ secrets.EMAIL }}
        run: python -m pytest -v --html=report.html

      - name: Upload HTML report
        uses: actions/upload-artifact@v1
        with:
          name: selenium-report
          path: packages/playground/tests/frontend_selenium/report.html

      - name: Upload server logs (if build failed)
        if: ${{ failure() && steps.vars.outputs.mode == 'build' }}
        uses: actions/upload-artifact@v1
        with:
          name: server-logs
          path: server.log

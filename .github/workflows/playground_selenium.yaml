name: Playground Selenium Tests

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Select the network to run tests on (dev, qa, test, main)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - test
          - main

jobs:
  remote-tests:
    runs-on: ubuntu-latest

    env:
      NETWORK: ${{ github.event.inputs.network }}
      TFCHAIN_MNEMONICS: ${{ secrets.TFCHAIN_MNEMONICS }}
      TFCHAIN_NODE_MNEMONICS: ${{ secrets.TFCHAIN_NODE_MNEMONICS }}
      STELLAR_ADDRESS: ${{ secrets.STELLAR_ADDRESS }}
      EMAIL: ${{ secrets.EMAIL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python deps
        run: |
          pip install -r packages/playground/tests/frontend_selenium/requirements.txt
          pip install pytest-html

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Node deps
        run: yarn install

      # ─── Patch base.py for DevNet URL ───────────────────────────────────────
      - name: Patch base.py for DevNet URL
        if: ${{ inputs.network == 'dev' }}
        run: |
          sed -i 's|staging.dashboard.dev.grid.tf|dashboard.dev.grid.tf|g' \
                packages/playground/tests/frontend_selenium/utils/base.py

      # ─── Replace Config.ini ─────────────────────────────────────────────────
      - name: Replace Config.ini
        run: |
          rm -f packages/playground/tests/frontend_selenium/Config.ini
          cat > packages/playground/tests/frontend_selenium/Config.ini <<EOF
          [Base]
          port = 5173
          net = ${{ inputs.network }}
          [Utils]
          seed = ${TFCHAIN_MNEMONICS}
          node_seed = ${TFCHAIN_NODE_MNEMONICS}
          address = ${STELLAR_ADDRESS}
          email = ${EMAIL}
          EOF

      - name: Debug Config.ini
        run: nl packages/playground/tests/frontend_selenium/Config.ini

      - name: Run Selenium tests
        working-directory: packages/playground/tests/frontend_selenium
        run: python -m pytest -v --html=report.html

      - name: Upload HTML report
        uses: actions/upload-artifact@v3
        with:
          name: selenium-report
          path: packages/playground/tests/frontend_selenium/report.html
